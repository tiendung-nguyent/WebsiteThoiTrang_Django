<div id="modalDetail" class="modal">
    <div class="modal-content" style="padding: 30px; text-align: left; max-width: 650px;">
        <button onclick="closeModal('modalDetail')"
                style="position: absolute; right: 20px; top: 20px; background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 20px;">&times;</button>

        <div style="text-align: center; margin-bottom: 20px;">
            <div style="width: 100px; height: 100px; background: #00aeef; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center;">
                <i class="fa fa-user" style="font-size: 50px; color: white;"></i>
            </div>
            <h2 id="detName" style="font-size: 22px; color: #002347; margin: 0; font-weight: 800;">Khách hàng</h2>
            <p style="font-size: 15px; color: #64748b; margin-top: 5px;">Mã KH: <span id="detKhId" style="font-weight: bold; color: #1e2937;"></span></p>
        </div>

        <h3 style="font-size: 16px; color: #1e2937; margin-top: 20px; font-weight: 700; border-top: 1px solid #f1f5f9; padding-top: 20px;">Danh sách Chi tiết khách hàng (Địa chỉ / Người nhận)</h3>
        
        <div style="max-height: 250px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 10px;">
            <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                <thead style="background: #f8fafc; position: sticky; top: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                    <tr>
                        <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #475569;">Mã CTKH</th>
                        <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #475569;">Người nhận</th>
                        <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #475569;">SĐT</th>
                        <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: #475569;">Địa chỉ</th>
                    </tr>
                </thead>
                <tbody id="detCtkhList">
                    <!-- Data injected via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
